plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Le dépôt GitHub d'où l'application télécharge Silencio à chaque lancement : donné par GitHub Actions
// (GITHUB_REPOSITORY = « compte/depot »), sinon par -Pdepot=compte/depot.
def depot = System.getenv('GITHUB_REPOSITORY') ?: (project.findProperty('depot') ?: '')
def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'fr.silencio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.silencio.app'
        minSdk 24
        targetSdk 34
        versionCode numero
        versionName "1.${numero}"
        buildConfigField 'String', 'DEPOT', "\"${depot}\""
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        // clé fixe (dans le dépôt) : une nouvelle version de l'application s'installe par-dessus l'ancienne
        stable {
            storeFile file('silencio.keystore')
            storePassword 'silencio'
            keyAlias 'silencio'
            keyPassword 'silencio'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stable }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'certifi'          // certificats HTTPS (TMDB, GitHub, IMDb) : Silencio n'a besoin de rien d'autre
        }
    }
}
